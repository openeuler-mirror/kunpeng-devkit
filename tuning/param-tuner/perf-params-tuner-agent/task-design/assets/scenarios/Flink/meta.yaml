# Flink 应用元信息
# 用于 KAT 模板生成 skill，定义 Flink 场景所需的变量、参数命令和生命周期命令
app_name: Flink
description: Apache Flink 分布式流处理框架
tuning_direction: "low"
performance_info: "latency"
param_template: param_Flink_hibench_System.yaml
native_benchmark: HiBench    # 原生压测工具名
native_benchmark_extract: |  # 原生压测工具的指标提取命令
  tail -n1
native_benchmark_command: |
  kafka_topic=$(cat /tmp/{timestamp}_run.log | grep -i 'metrics is being written to kafka topic' | awk -F 'metrics is being written to kafka topic ' '{print $2}'); csv_path=$(timeout 600 echo "$kafka_topic" | sh {hibench_home}/bin/workloads/streaming/identity/common/metrics_reader.sh | grep 'written out metrics to' | awk -F'written out metrics to ' '{print $2}'); if [ ! -e $csv_path ]; then echo 'The HiBench report csv does not exist.' && exit 1; fi; mean_latency=$(awk -F, 'NR==1{for(i=1;i<=NF;i++) if($i=="mean_latency(ms)") col=i} NR==2{print $col}' $csv_path); throughput=$(awk -F, 'NR==1{for(i=1;i<=NF;i++) if($i=="throughput(msgs/s)") col=i} NR==2{print $col}' $csv_path); if [ "$mean_latency" == "0" ]; then echo 'The Hibench load execution is abnormal. The obtained latency is 0.0.' && exit 1; fi; echo "$mean_latency"

# ── 部分1: 应用执行框架（内置场景时使用）──
# 定义内置场景需要收集的变量，用于填充 cmd 模板
app_framework:
  vars:
    - name: flink_home
      desc: Flink 安装路径（FLINK_HOME，flink、start-cluster.sh 所在目录的上级）
      search_targets:
        - start-cluster.sh
        - flink
      placeholder: /path/flink
    - name: hadoop_home
      desc: Hadoop 安装路径（HADOOP_HOME）
      env_var: HADOOP_HOME
      search_targets:
        - hadoop
      placeholder: /path/hadoop
    - name: java_home
      desc: Java 安装路径（JAVA_HOME）
      env_var: JAVA_HOME
      search_targets:
        - java
      placeholder: /path/java

# ── 部分2: 应用参数组（任何场景均可使用）──
# 定义 Flink 参数下发命令所需的变量和模板
param_group:
  vars:
    - name: flink_home
      desc: Flink 安装路径
      reuse_from: app_framework
  command_templates:
    query: |
      grep -E '^\s*<kat_name>\s*:' {flink_home}/conf/flink-conf.yaml_kat | tail -n1 | sed 's/^[^:]*:\s*//' | tr -d '\n'
    assign: |
      output=$(cat {flink_home}/conf/flink-conf.yaml_kat | grep -wn "^\s*<kat_name>" | grep -vE '^[0-9]+:#' | awk -F ":" '{print $1}'); if [ -z "$output" ]; then echo "<kat_name>: <kat_value>" >> {flink_home}/conf/flink-conf.yaml_kat; else line_nums=($output); for line_num in "${line_nums[@]}"; do if [ -n "$line_num" ]; then sed -i "${line_num}c <kat_name>: <kat_value>" {flink_home}/conf/flink-conf.yaml_kat; fi; done; fi
    backup: |
      cp -f {flink_home}/conf/flink-conf.yaml_kat {flink_home}/conf/flink-conf.yaml_kat_bak && echo 'The new configuration will be saved to {flink_home}/conf/flink-conf.yaml_kat. You can load it later if necessary.'
    recover: |
      cp -f {flink_home}/conf/flink-conf.yaml_kat_bak {flink_home}/conf/flink-conf.yaml_kat && echo 'The {flink_home}/conf/flink-conf.yaml_kat file has been restored to the initial configuration.'
    execute_after_assign: |
      sed -i 's/^\s*$//;/^$/d' {flink_home}/conf/flink-conf.yaml_kat

# ── 部分3: 生命周期命令（内置场景预定义，复用 KAT 内部 cmd 流程）──
# 除 run_test 外的所有命令均为预定义模板，LLM 只需替换变量，无需自行生成
cmd:
  set_up:
    - cmd: |
        if [ ! -e {flink_home}/bin/flink ]; then echo 'The file {flink_home}/bin/flink does not exist. Please check whether flink_home is correct.' && exit 1; fi; if [ ! -r {flink_home}/bin/flink ] || [ ! -x {flink_home}/bin/flink ]; then echo 'Does not have the permission to execute {flink_home}/bin/flink' && exit 1; fi; if [ ! -e {flink_home}/conf/flink-conf.yaml ]; then echo 'The file {flink_home}/conf/flink-conf.yaml does not exist.' && exit 1; fi; if [ ! -r {flink_home}/conf/flink-conf.yaml ] || [ ! -w {flink_home}/conf ]; then echo 'Does not have the permission to copy {flink_home}/conf/flink-conf.yaml' && exit 1; fi; if [ ! -e {hadoop_home} ]; then echo '{hadoop_home} is not exist. Please check whether hadoop_home is correct.' && exit 1; fi; if [ ! -e {java_home}/bin/java ]; then echo 'Java not found at {java_home}/bin/java. Please check whether java_home is correct.' && exit 1; fi;
      host_name: []
    - cmd: |
        if [ ! -e {flink_home}/conf/flink-conf.yaml_kat ]; then cp -f {flink_home}/conf/flink-conf.yaml {flink_home}/conf/flink-conf.yaml_kat; fi;
      host_name: []
  round_set_up:
    - cmd: |
        cp -f {flink_home}/conf/flink-conf.yaml_kat {flink_home}/conf/flink-conf.yaml && {flink_home}/bin/stop-cluster.sh 2>/dev/null; sleep 2; {flink_home}/bin/start-cluster.sh 2>/dev/null || echo 'Failed to restart Flink cluster' && exit 1;
      host_name: []
  run_test:
    - cmd: |
        output=$(timeout 600 {flink_home}/bin/yarn-session.sh -d ); ec=$?; if [ $ec -eq 124 ]; then echo "$output" && exit 1; fi; web_interface=$(echo "$output" | grep -oP 'JobManager Web Interface: http://\S+' | head -n 1 | awk -F/ '{print $3}') || { echo 'Failed to get the web interface of flink on yarn cluster, the execution result is: $output' && exit 1; }; stop_cmd=$(echo "$output" | grep -w '$ yarn application -kill' | sed 's/^..//') || { echo 'Failed to get the stop command of flink on yarn cluster, the execution result is: $output' && exit 1; }; output=$(cat {hibench_home}/conf/flink.conf | grep -wn hibench.flink.master | grep -v "#" | awk -F ":" '{print $1}'); if [ -n "$output" ]; then sed -i "${output}c hibench.flink.master $web_interface" {hibench_home}/conf/flink.conf; fi; echo "$stop_cmd" > /tmp/{timestamp}_stop.log
      host_name: []
    - cmd: |
        if [ ! -s /tmp/kat_java_params.log ] ; then exit 0; fi; jvm_opts=$(tr '\n' ' ' < /tmp/kat_java_params.log | xargs) && conf_line="env.java.opts: $jvm_opts" && line_nums=$(grep -wn "^env.java.opts" {flink_home}/conf/flink-conf.yaml | grep -vE "^[0-9]+:#" | cut -d: -f1) && if [ -z "$line_nums" ]; then echo "$conf_line" >> {flink_home}/conf/flink-conf.yaml; else for line in $line_nums; do sed -i "${line}c $conf_line" {flink_home}/conf/flink-conf.yaml; done; fi
      host_name: []
    - cmd: |
        {hibench_home}/bin/workloads/streaming/identity/flink/run.sh &> /tmp/{timestamp}_run.log &
      host_name: []
      asynchronous: True
    - cmd: |
        sleep 5 && output=$(timeout 180 sh {hibench_home}/bin/workloads/streaming/identity/prepare/dataGen.sh 2>&1); error=$(echo "$output" | grep -i 'exception\|fail'); if [ -n "$error" ]; then echo "$output" && exit 1; else exit 0; fi;
      host_name: []
    - cmd: |
        job_id=$(cat /tmp/{timestamp}_run.log | grep -i 'Job has been submitted with JobID' | awk -F 'Job has been submitted with JobID ' '{print $2}'); echo $job_id; if [ -z "$job_id" ]; then cat /tmp/{timestamp}_run.log >&2 && exit 1; else {flink_home}/bin/flink cancel "$job_id" && exit 0; fi;
      host_name: []
  round_tear_down:
    - cmd: |
        {flink_home}/bin/stop-cluster.sh 2>/dev/null || true; sleep 2;
      host_name: []
  tear_down:
    - cmd: |
        rm -f {flink_home}/conf/flink-conf.yaml_kat_bak
      host_name: []
