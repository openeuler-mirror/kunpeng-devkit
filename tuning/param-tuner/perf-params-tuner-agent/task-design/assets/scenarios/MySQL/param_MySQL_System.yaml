          version:
              - - "5.7.22"
                - "5.7.43"
              - - "8.0.11"
                - "8.0.28"
          suffix: "MB"
          des: "Generally, the combined size of the log files should be large enough that the server can smooth out peaks and troughs in workload activity, which often means that there is enough redo log space to handle more than an hour of write activity. The larger the value, the less checkpoint flush activity is required in the buffer pool, saving disk I/O. Larger log files also make crash recovery slower."
