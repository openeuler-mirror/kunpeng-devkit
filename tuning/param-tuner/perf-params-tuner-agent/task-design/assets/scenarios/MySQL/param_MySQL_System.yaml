# 本文件是用于使用鲲鹏自动调优工具对应用进行调优的参数模板文件
MySQL:
    params:
        - name: "innodb_adaptive_flushing_lwm"
          ptype: "uniform_int"
          upper: 70
          lower: 0
          suggestion: ""
          choices: []
          enable: True
          version:
              - - "5.0"
                - "latest"
          des: "Defines the low water mark representing percentage of redo log capacity at which adaptive flushing is enabled."
        - name: "innodb_adaptive_max_sleep_delay"
          ptype: "uniform_int"
          upper: 1000000
          lower: 0
          suggestion: ""
          choices: []
          enable: True
          version:
              - - "5.0"
                - "latest"
        - name: "innodb_max_dirty_pages_pct_lwm"
          ptype: "uniform_int"
          upper: 99
          lower: 0
          suggestion: ""
          choices: []
          enable: True
          version:
              - - "5.0"
                - "latest"
          des: "Defines a low water mark representing the percentage of dirty pages at which preflushing is enabled to control the dirty page ratio. A value of 0 disables the pre-flushing behavior entirely. "
        - name: "thread_cache_size"
          ptype: "uniform_int"
          upper: 16384
          lower: 2000
          suggestion: ""
          choices: []
          enable: True
          version:
              - - "5.0"
                - "latest"
          des: "default -1,def func: 8 + (max_connections / 100)"
