# 远程主机清单。复制到 /opt/kunpeng-migration/collection/work 后填写；不要在此文件中写明文密码或私钥内容。
# Agent端配置、执行文件、日志、凭据和采集结果必须统一放在该绝对目录下。
WORK_DIR=/opt/kunpeng-migration/collection
# macOS 使用 Keychain 并忽略此项；Linux 密码认证时使用以下凭据目录。
CREDENTIAL_STORE=/opt/kunpeng-migration/collection/credentials
CREDENTIAL_GPG_RECIPIENT=

[app-prod-01]
address=192.0.2.10
port=22
user=root
auth=key
# 留空时使用 SSH Agent 和 OpenSSH 默认密钥；填写时必须使用本机绝对路径。
identity_file=
credential_id=
privilege=direct
# 源端临时目录；完整采集同步后由 cleanup 命令删除。
remote_staging_root=/opt/kunpeng-migration/collection/remote

[db-prod-01]
address=192.0.2.11
port=22
user=root
auth=password
identity_file=
# Agent以该非敏感 ID 执行 credential-set；密码由用户通过前端输入并加密保存。
credential_id=db-prod-01
privilege=direct
# 源端临时目录；完整采集同步后由 cleanup 命令删除。
remote_staging_root=/opt/kunpeng-migration/collection/remote
