# KingbaseES silent install configuration
# Rendered by envsubst from kingbase_silent.cfg; see references/kingbase-deploy-guide.md

# license file path (empty = trial license auto-generated)
KB_LICENSE_PATH=${KB_LICENSE_PATH}

# install set, options are Full, Client, Custom
CHOSEN_INSTALL_SET=${CHOSEN_INSTALL_SET}
# component list
CHOSEN_FEATURE_LIST=${CHOSEN_FEATURE_LIST}

# install dir path
USER_INSTALL_DIR=${INSTALL_PATH}

# data dir path
USER_SELECTED_DATA_FOLDER=${DATA_PATH}

# init db params
# server port
DB_PORT=${PORT_NUM}
# user name
DB_USER=${DB_USER}
# password
DB_PASS=${DB_PASS}
# password confirm
DB_PASS2=${DB_PASS}
# encoding
ENCODING_PARAM=${ENCODING_PARAM}

# locale
LOCALE_PARAM=${LOCALE_PARAM}

# init db custom parameters
INITCUSTOM=

# compatibility mode: ORACLE / PG / MySQL
DATABASE_MODE_PARAM=${DATABASE_MODE_PARAM}
# case sensitivity: YES / NO
CASE_SENSITIVE_PARAM=${CASE_SENSITIVE_PARAM}
# block size: 8k / 16k / 32k
BLOCK_SIZE_PARAM=${BLOCK_SIZE_PARAM}

# authentication method: scram-sha-256 / scram-sm3 / sm4 / sm3
AUTHENTICATION_METHOD_PARAM=${AUTHENTICATION_METHOD_PARAM}
